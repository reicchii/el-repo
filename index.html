<!-- order matters: core (data, store), sky (map), explore (shared helpers, Sky Explorer), pages (everything else, router) -->
<script id="pw-stale-purge">
/* Drop store keys from earlier builds so the browser cannot show a stale interface. */
try{['pw-v5','pw-v6','pw-v7','pw-v8','pw-v9'].forEach(function(k){localStorage.removeItem(k)})}catch(e){}
</script>
<script src="pw/core.js?v=new1"></script>
