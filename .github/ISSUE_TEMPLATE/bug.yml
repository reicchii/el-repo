name: Bug
description: The site, the API or the pipeline works differently from the docs
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Cite the doc section if there is one.
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: URL, target, endpoint or command
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
